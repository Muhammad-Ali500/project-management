# Production compose file for a self-managed host (e.g. a GCP Compute Engine VM).
#
# Unlike docker-compose.yml (which builds images locally for local dev), this file
# PULLS pre-built images from Artifact Registry. CI builds and pushes the images;
# the deploy step on the VM only needs to `docker compose pull && docker compose up -d`.
#
# Required environment variables (put them in a `.env` file next to this one on the VM,
# see docs/gcp-cicd-guide.md):
#   AR_REPO   e.g. us-central1-docker.pkg.dev/my-project/project-manager
#   TAG       image tag to deploy, e.g. a git SHA
#
# Usage on the VM:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    networks:
      - app_net

  backend:
    image: ${AR_REPO}/backend:${TAG}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: project_manager
    depends_on:
      mongo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    networks:
      - app_net

  frontend:
    image: ${AR_REPO}/frontend:${TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    mem_limit: 128m
    cpus: 0.5
    networks:
      - app_net

volumes:
  mongo_data:

networks:
  app_net:
    driver: bridge
